name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check page scripts
        run: |
          node --check pierhop/static/host.js
          node --check pierhop/static/device.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
